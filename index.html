<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2f4ed">
    <title>WLiT Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="calculator.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar" aria-label="Page header">
        <a class="wordmark" href="./" aria-label="WLiT Calculator home">
          <span class="wordmark-mark" aria-hidden="true">+</span>
          <span>WLiT <span class="wordmark-light">CALCULATOR</span></span>
        </a>
        <span class="topbar-note">INSTRUMENT NO. 01</span>
      </header>

      <section class="calculator-layout" aria-labelledby="page-title">
        <div class="intro">
          <p class="eyebrow"><span class="status-dot"></span> EVERYDAY ARITHMETIC</p>
          <h1 id="page-title">Make it<br><span>add up.</span></h1>
          <p class="intro-index">01 <span>/</span> 01</p>
        </div>

        <section class="calculator" aria-label="Calculator">
          <div class="calculator-topline">
            <span>CALCULATOR</span>
            <span class="live-indicator"><span></span> READY</span>
          </div>
          <div class="display" aria-live="polite" aria-atomic="true">
            <div class="expression" id="expression" aria-label="Expression">&nbsp;</div>
            <output class="result" id="result" aria-label="Display">0</output>
          </div>
          <div class="keypad" aria-label="Calculator keys">
            <button class="key key-utility" data-action="clear" aria-label="Clear all">AC</button>
            <button class="key key-utility" data-action="parentheses" aria-label="Parentheses">( )</button>
            <button class="key key-utility" data-action="percent" aria-label="Percent">%</button>
            <button class="key key-operator" data-value="/" aria-label="Divide">÷</button>

            <button class="key" data-value="7">7</button>
            <button class="key" data-value="8">8</button>
            <button class="key" data-value="9">9</button>
            <button class="key key-operator" data-value="*" aria-label="Multiply">×</button>

            <button class="key" data-value="4">4</button>
            <button class="key" data-value="5">5</button>
            <button class="key" data-value="6">6</button>
            <button class="key key-operator" data-value="-" aria-label="Subtract">−</button>

            <button class="key" data-value="1">1</button>
            <button class="key" data-value="2">2</button>
            <button class="key" data-value="3">3</button>
            <button class="key key-operator" data-value="+" aria-label="Add">+</button>

            <button class="key key-utility" data-action="sign" aria-label="Change sign">+/−</button>
            <button class="key key-zero" data-value="0">0</button>
            <button class="key" data-action="decimal" aria-label="Decimal point">.</button>
            <button class="key key-equals" data-action="equals" aria-label="Equals">=</button>
          </div>
          <footer class="calculator-footer">
            <span>WLIT / 2026</span>
            <button class="delete-key" data-action="delete" aria-label="Delete last character">DEL</button>
          </footer>
        </section>
      </section>

      <footer class="page-footer">
        <span>PRECISION IN THE SMALL THINGS.</span>
        <span>EST. 01</span>
      </footer>
    </main>
  </body>
</html>
